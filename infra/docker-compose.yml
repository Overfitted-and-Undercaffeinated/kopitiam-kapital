version: '3.8'

services:
  # Redis for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # PostgreSQL (if not using Supabase cloud)
  postgres:
    image: supabase/postgres:15.1.0.117
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # AI Backend
  ai:
    build: ../apps/ai
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - ../apps/ai/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../apps/ai:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery_worker:
    build: ../apps/ai
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - ../apps/ai/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../apps/ai:/app
    command: celery -A jobs.tasks worker --loglevel=info

  # Celery Beat (Scheduler)
  celery_beat:
    build: ../apps/ai
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - ../apps/ai/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../apps/ai:/app
    command: celery -A jobs.tasks beat --loglevel=info

volumes:
  redis_data:
  postgres_data:

