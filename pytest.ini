[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Integration tests with real API calls (run with: pytest -m integration --enable-api)
    unit: Unit tests with mocks only
addopts = 
    -v
    --tb=short
    --strict-markers
filterwarnings =
    ignore::DeprecationWarning

